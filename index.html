<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoldAlign Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020617;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Video Background */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            background: #0f172a;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(2, 6, 23, 0.4) 0%, rgba(2, 6, 23, 0.9) 100%);
            z-index: 1;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .grid-overlay.active {
            opacity: 1;
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            animation: fadeInDown 0.8s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--primary);
            color: var(--primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 99px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        .dot.error {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            animation: none;
        }

        /* Guide Overlay */
        .guide-container {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 24px;
        }

        #guide-svg {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 55vh;
            overflow: visible;
        }

        /* SVG Animations */
        @keyframes slideRight {
            0% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(12px); opacity: 0; }
        }
        .animate-arrow-right { animation: slideRight 1.5s ease-in-out infinite; }

        @keyframes slideLeft {
            0% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-12px); opacity: 0; }
        }
        .animate-arrow-left { animation: slideLeft 1.5s ease-in-out infinite; }

        @keyframes slideUp {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-12px); opacity: 0; }
        }
        .animate-arrow-up { animation: slideUp 1.5s ease-in-out infinite; }
        
        .guide-container svg * {
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Control Panel */
        .control-panel {
            position: relative;
            z-index: 10;
            margin: auto 24px 32px 24px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            max-width: 800px;
            align-self: center;
            width: calc(100% - 48px);
            animation: fadeInUp 0.8s ease;
        }

        .step-indicator {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #step-number {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            width: 20%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .text-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .text-content h2, .text-content p {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        h2 {
            font-size: 2.25rem;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.125rem;
            line-height: 1.6;
            margin: 0;
            font-weight: 300;
        }

        .button-group {
            display: flex;
            gap: 16px;
        }

        .btn {
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 1.0625rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            flex: 2;
            box-shadow: 0 4px 20px -4px rgba(59, 130, 246, 0.6);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 8px 25px -4px rgba(59, 130, 246, 0.7);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            flex: 1;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header { padding: 16px 20px; }
            .control-panel {
                margin: auto 16px 24px 16px;
                padding: 24px;
                width: calc(100% - 32px);
                border-radius: 24px;
            }
            h2 { font-size: 1.75rem; }
            p { font-size: 1rem; }
            .logo { font-size: 1.1rem; }
            .status-text { display: none; }
            .status-indicator { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Video Background -->
        <video id="camera-feed" autoplay playsinline muted></video>
        <div class="video-overlay"></div>
        <div class="grid-overlay" id="grid-overlay"></div>

        <!-- Header -->
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/>
                </svg>
                FoldAlign
            </div>
            
            <div class="header-controls">
                <button id="btn-grid" class="icon-btn" title="Toggle Alignment Grid">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3h18v18H3z"/>
                        <path d="M3 9h18"/>
                        <path d="M3 15h18"/>
                        <path d="M9 3v18"/>
                        <path d="M15 3v18"/>
                    </svg>
                </button>
                <div class="status-indicator" id="camera-status">
                    <span class="dot"></span> <span class="status-text">Camera Active</span>
                </div>
            </div>
        </header>

        <!-- Guide Overlay (SVG) -->
        <div class="guide-container">
            <svg id="guide-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                <!-- SVG content injected via JS -->
            </svg>
        </div>

        <!-- Controls / Instructions -->
        <div class="control-panel">
            <div class="step-indicator">
                <span id="step-number">Step 1 of 5</span>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
            
            <div class="text-content">
                <h2 id="step-title">Align Garment</h2>
                <p id="step-description">Place the t-shirt face down. Align it within the dashed guide. Smooth out all wrinkles.</p>
            </div>
            
            <div class="button-group">
                <button id="btn-prev" class="btn btn-secondary" disabled>Previous</button>
                <button id="btn-next" class="btn btn-primary">
                    Next Step 
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const steps = [
            {
                title: "Align Garment",
                desc: "Place the t-shirt face down. Align it within the dashed guides below. Smooth out all wrinkles.",
                render: () => `
                    <!-- Main Body -->
                    <rect x="25" y="15" width="50" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.8)" stroke-width="0.8" stroke-dasharray="2,3" rx="4" />
                    <!-- Left Sleeve -->
                    <polygon points="25,20 8,30 15,45 25,38" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.8" stroke-dasharray="2,3" stroke-linejoin="round"/>
                    <!-- Right Sleeve -->
                    <polygon points="75,20 92,30 85,45 75,38" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.8" stroke-dasharray="2,3" stroke-linejoin="round"/>
                    <!-- Collar -->
                    <path d="M 40 15 Q 50 25 60 15" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.8" stroke-dasharray="2,3" stroke-linecap="round"/>
                    
                    <text x="50" y="50" fill="rgba(255,255,255,0.9)" font-size="3.5" font-weight="600" text-anchor="middle" letter-spacing="1">ALIGN T-SHIRT HERE</text>
                `
            },
            {
                title: "Fold Left Side",
                desc: "Fold the left sleeve and side towards the center. The edge should align roughly with the center line.",
                render: () => `
                    <!-- Base alignment (faint) -->
                    <rect x="25" y="15" width="50" height="70" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" rx="4" />
                    <!-- Center line -->
                    <line x1="50" y1="15" x2="50" y2="85" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" stroke-dasharray="1,2" />
                    
                    <!-- Left Folded Area -->
                    <rect x="33" y="15" width="17" height="70" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="0.8" rx="2" style="filter: drop-shadow(0 0 6px rgba(59,130,246,0.4))"/>
                    
                    <!-- Animated Arrow -->
                    <g class="animate-arrow-right">
                        <line x1="12" y1="50" x2="38" y2="50" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
                        <polyline points="33,45 38,50 33,55" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                `
            },
            {
                title: "Fold Right Side",
                desc: "Fold the right sleeve and side towards the center, overlapping the left fold to create a straight rectangle.",
                render: () => `
                    <!-- Base alignment -->
                    <rect x="25" y="15" width="50" height="70" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" rx="4" />
                    
                    <!-- Previous Fold (Left) - now faint -->
                    <rect x="33" y="15" width="17" height="70" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" rx="2" />
                    
                    <!-- Right Folded Area -->
                    <rect x="50" y="15" width="17" height="70" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="0.8" rx="2" style="filter: drop-shadow(0 0 6px rgba(139,92,246,0.4))"/>
                    
                    <!-- Animated Arrow -->
                    <g class="animate-arrow-left">
                        <line x1="88" y1="50" x2="62" y2="50" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
                        <polyline points="67,45 62,50 67,55" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                `
            },
            {
                title: "Fold Bottom Up",
                desc: "Fold the bottom half of the shirt upwards so the bottom edge meets the top collar area.",
                render: () => `
                    <!-- Fully Folded Vertical Rectangle -->
                    <rect x="33" y="15" width="34" height="70" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" rx="2" />
                    
                    <!-- Top Half (Target) -->
                    <rect x="33" y="15" width="34" height="35" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="0.8" rx="2" style="filter: drop-shadow(0 0 6px rgba(16,185,129,0.4))"/>
                    
                    <!-- Animated Arrow -->
                    <g class="animate-arrow-up">
                        <line x1="50" y1="80" x2="50" y2="45" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
                        <polyline points="45,50 50,45 55,50" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                `
            },
            {
                title: "Final Result",
                desc: "Flip the shirt over. You now have a perfectly folded, compact t-shirt ready for storage.",
                render: () => `
                    <!-- Final Folded Shirt -->
                    <rect x="33" y="32" width="34" height="35" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" rx="3" style="filter: drop-shadow(0 0 10px rgba(16,185,129,0.5))"/>
                    
                    <!-- Collar Detail -->
                    <path d="M 44 32 Q 50 38 56 32" fill="none" stroke="#10b981" stroke-width="0.8" stroke-linecap="round"/>
                    
                    <!-- Success Checkmark -->
                    <circle cx="50" cy="50" r="7" fill="#10b981" />
                    <polyline points="47,50 49,52 54,47" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    
                    <text x="50" y="75" fill="#10b981" font-size="4" font-weight="600" text-anchor="middle" letter-spacing="1">PERFECT FOLD</text>
                `
            }
        ];

        // UI State
        let currentStep = 0;
        
        // DOM Elements
        const svgGuide = document.getElementById('guide-svg');
        const stepTitle = document.getElementById('step-title');
        const stepDesc = document.getElementById('step-description');
        const stepNumber = document.getElementById('step-number');
        const progressFill = document.getElementById('progress-fill');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnGrid = document.getElementById('btn-grid');
        const gridOverlay = document.getElementById('grid-overlay');

        // Render Initial Step
        renderStep(0);

        function renderStep(index) {
            const step = steps[index];
            
            // Fade out text
            stepTitle.style.opacity = '0';
            stepDesc.style.opacity = '0';
            stepTitle.style.transform = 'translateY(5px)';
            stepDesc.style.transform = 'translateY(5px)';
            
            setTimeout(() => {
                // Update text content
                stepTitle.textContent = step.title;
                stepDesc.textContent = step.desc;
                
                // Fade in text
                stepTitle.style.opacity = '1';
                stepDesc.style.opacity = '1';
                stepTitle.style.transform = 'translateY(0)';
                stepDesc.style.transform = 'translateY(0)';
            }, 250);

            // Update SVG content
            svgGuide.innerHTML = step.render();
            
            // Update progress and indicators
            stepNumber.textContent = \`Step \${index + 1} of \${steps.length}\`;
            progressFill.style.width = \`\${((index + 1) / steps.length) * 100}%\`;
            
            // Update buttons
            btnPrev.disabled = index === 0;
            if (index === steps.length - 1) {
                btnNext.innerHTML = \`Restart Guide 
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <polyline points="23 20 23 14 17 14"></polyline>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                    </svg>\`;
                btnNext.style.background = 'var(--success)';
                btnNext.style.boxShadow = '0 4px 20px -4px rgba(16, 185, 129, 0.6)';
            } else {
                btnNext.innerHTML = \`Next Step 
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>\`;
                btnNext.style.background = 'var(--primary)';
                btnNext.style.boxShadow = '0 4px 20px -4px rgba(59, 130, 246, 0.6)';
            }
        }

        // Event Listeners
        btnNext.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
            } else {
                currentStep = 0; // Restart
            }
            renderStep(currentStep);
        });

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnGrid.addEventListener('click', () => {
            gridOverlay.classList.toggle('active');
            btnGrid.classList.toggle('active');
        });

        // Initialize Camera
        async function initCamera() {
            const video = document.getElementById('camera-feed');
            const statusIndicator = document.getElementById('camera-status');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment', // Prefer back camera
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                // Update status UI
                statusIndicator.innerHTML = \`<span class="dot error"></span> <span class="status-text">Camera Unavailable</span>\`;
                
                // Show a nice fallback background if camera fails
                document.querySelector('.video-overlay').style.background = 'linear-gradient(135deg, #020617, #1e293b)';
            }
        }

        // Start camera on load
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
