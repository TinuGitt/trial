<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOMATIC LOOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"></script>
    <style>
        :root {
            --bg: #0A0A0A;
            --text: #E0E0E0;
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        #canvas-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        #webcam {
            position: absolute;
            opacity: 0; /* Hidden initially */
            transform: scaleX(-1);
            filter: grayscale(1) blur(10px);
            transition: opacity 10s ease;
        }
        #ui-layer {
            z-index: 20;
            max-width: 600px;
            padding: 20px;
            letter-spacing: 2px;
            line-height: 1.6;
            transition: filter 2s, opacity 2s;
        }
        .start-btn {
            background: none;
            border: 1px solid var(--text);
            color: var(--text);
            padding: 15px 30px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            cursor: pointer;
            letter-spacing: 5px;
            transition: all 0.5s;
        }
        .start-btn:hover {
            background: var(--text);
            color: var(--bg);
        }
        #vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,0);
            pointer-events: none;
            z-index: 15;
            transition: box-shadow 5s;
        }
        #void-dot {
            width: 2px; height: 2px;
            background: white;
            border-radius: 50%;
            display: none;
        }
    </style>
</head>
<body>

    <div id="vignette"></div>
    <canvas id="canvas-overlay"></canvas>
    
    <div id="app">
        <video id="webcam" autoplay playsinline></video>
        
        <div id="ui-layer">
            <div id="text-content">
                <button class="start-btn" id="start-btn">BEGIN</button>
            </div>
            <div id="void-dot"></div>
        </div>
    </div>

<script type="module">
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas-overlay');
    const ctx = canvas.getContext('2d');
    const uiLayer = document.getElementById('ui-layer');
    const textContent = document.getElementById('text-content');
    const vignette = document.getElementById('vignette');
    const startBtn = document.getElementById('start-btn');

    let faceLandmarker;
    let audioCtx;
    let track1, track2, currentSource;
    let lowPass;
    let lastVideoTime = -1;
    
    // Simulation Variables
    let totalLife = 420; // 7 minutes
    let isPaused = false;
    let isGameOver = false;
    let restPhaseActive = false;
    let lastBlinkTime = 0;
    let hasEnded = false;

    const milestones = [
        { age: 420, text: "It is a Tuesday. You are small. Breathe in the smell of the carpet." },
        { age: 340, text: "You think you have time. Everyone does." },
        { age: 240, text: "CLOSE YOUR EYES. REMEMBER THE HOUSE YOU GREW UP IN.", forced: true, duration: 15 },
        { age: 140, text: "The names of your friends are slipping through your fingers like water." },
        { age: 60, text: "KEEP THEM CLOSED. IT IS LATE. EVERYONE IS SLEEPING.", forced: true, duration: 20 },
        { age: 15, text: "One last blink for the road." }
    ];

    async function initMediaPipe() {
        const vision = await ff_tasks_vision.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );
        faceLandmarker = await ff_tasks_vision.FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                delegate: "GPU"
            },
            outputFaceBlendshapes: true,
            runningMode: "VIDEO",
            numFaces: 1
        });
    }

    async function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        lowPass = audioCtx.createBiquadFilter();
        lowPass.type = "lowpass";
        lowPass.frequency.value = 20000;

        const loadTrack = async (url) => {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        };

        // Placeholder logic: Since files are local, we try-catch for the demo
        try {
            track1 = await loadTrack('track1.mp3');
            track2 = await loadTrack('track2.mp3');
        } catch (e) {
            console.error("Audio files not found. Using generated silence/noise for logic.");
        }

        playTrack(track1);
    }

    function playTrack(buffer) {
        if (!buffer) return;
        currentSource = audioCtx.createBufferSource();
        currentSource.buffer = buffer;
        currentSource.loop = true;
        currentSource.connect(lowPass).connect(audioCtx.destination);
        currentSource.start();
    }

    function applyBlinkMuffle() {
        lowPass.frequency.cancelScheduledValues(audioCtx.currentTime);
        lowPass.frequency.setValueAtTime(200, audioCtx.currentTime);
        lowPass.frequency.exponentialRampToValueAtTime(20000, audioCtx.currentTime + 0.4);
    }

    function applyTapeDecay() {
        if (!currentSource || totalLife > 120) return;
        const decay = Math.sin(audioCtx.currentTime * 0.5) * 0.02;
        currentSource.playbackRate.value = 0.98 + decay;
    }

    // --- Visuals ---
    function renderGrain() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            const val = Math.random() * 255;
            data[i] = data[i+1] = data[i+2] = val;
            data[i+3] = 15; // Noise opacity
        }
        ctx.putImageData(imageData, 0, 0);
    }

    function updateVisualShift() {
        const progress = totalLife / 420;
        if (progress > 0.8) {
            uiLayer.style.filter = `blur(${(progress - 0.8) * 50}px) brightness(3)`;
        } else if (progress > 0.2) {
            uiLayer.style.filter = `blur(0px) grayscale(0)`;
        } else {
            vignette.style.boxShadow = `inset 0 0 ${300 - (progress * 1000)}px rgba(0,0,0,1)`;
        }
    }

    // --- Main Logic ---
    async function update() {
        if (isGameOver) return;

        if (video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceBlendshapes && results.faceBlendshapes.length > 0) {
                const shapes = results.faceBlendshapes[0].categories;
                const leftEye = shapes.find(s => s.categoryName === "eyeBlinkLeft").score;
                const rightEye = shapes.find(s => s.categoryName === "eyeBlinkRight").score;

                if (leftEye > 0.6 && rightEye > 0.6) {
                    handleBlink();
                } else {
                    handleEyesOpen();
                }
            }
        }

        if (!isPaused && !restPhaseActive) {
            totalLife -= 0.016; // Approx 60fps
            applyTapeDecay();
        }

        checkMilestones();
        updateVisualShift();
        renderGrain();
        requestAnimationFrame(update);
    }

    function handleBlink() {
        const now = Date.now();
        if (now - lastBlinkTime > 500) {
            totalLife -= 5;
            applyBlinkMuffle();
            lastBlinkTime = now;
            
            if (totalLife <= 0 && !hasEnded) {
                endSimulation();
            }
        }
        
        if (restPhaseActive) {
            // While eyes are closed during rest, timer effectively "pauses" elsewhere 
            // but we use this to fulfill the requirement.
        }
    }

    function handleEyesOpen() {
        if (restPhaseActive) {
            totalLife -= 0.33; // Penalty: 20 seconds per second
        }
    }

    function checkMilestones() {
        const currentMilestone = milestones.find(m => Math.abs(m.age - totalLife) < 0.5);
        if (currentMilestone && textContent.innerText !== currentMilestone.text) {
            textContent.innerText = currentMilestone.text;
            
            if (currentMilestone.forced) {
                triggerRestPhase(currentMilestone.duration);
            }
        }
    }

    async function triggerRestPhase(duration) {
        restPhaseActive = true;
        if (audioCtx) audioCtx.suspend();
        
        setTimeout(() => {
            restPhaseActive = false;
            if (audioCtx) audioCtx.resume();
        }, duration * 1000);
    }

    function endSimulation() {
        isGameOver = true;
        hasEnded = true;
        if (audioCtx) audioCtx.close();
        
        video.style.opacity = "0.1";
        textContent.innerHTML = `
            <p>"You were here for seven minutes. In that time, the world moved on."</p>
            <p>"You are now 2,100 blinks closer to your real end than when you started."</p>
            <p>"It was a very quiet life. We hope you enjoyed the view."</p>
        `;

        setTimeout(() => {
            textContent.style.opacity = "0";
            video.style.opacity = "0";
            setTimeout(() => {
                document.getElementById('void-dot').style.display = "block";
                // Final shrink would be handled by CSS animation or JS
            }, 5000);
        }, 10000);
    }

    startBtn.onclick = async () => {
        startBtn.style.display = "none";
        await initMediaPipe();
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await initAudio();
        update();
    };

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

</script>
</body>
</html>
